<tbody>

{% for task in tasks %}

<tr>

    <td>{{ task.title }}</td>

    <td>{{ task.person }}</td>

    <td>{{ task.deadline }}</td>

    <td>{{ task.status }}</td>

    <td>

        <button class="edit-btn">編集</button>

        <button class="delete-btn">削除</button>

    </td>

</tr>

{% endfor %}

</tbody>
