<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>タスク一覧</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>タスク一覧</h1>

    <a href="/task/add" class="back">
        ＋ タスク追加
    </a>

    <br><br>

    <table class="calendar">

        <tr>
            <th>タイトル</th>
            <th>担当者</th>
            <th>期限</th>
            <th>進捗</th>
            <th>操作</th>
        </tr>

        {% for task in tasks %}
        <tr>

            <td>{{ task.title }}</td>
            <td>{{ task.person }}</td>
            <td>{{ task.deadline }}</td>
            <td>{{ task.status }}</td>

            <td>

                <a href="/edit/{{ task.id }}"
                   class="back">
                    編集
                </a>

                <a href="/delete/{{ task.id }}"
                   class="back"
                   onclick="return confirm('本当に削除しますか？')">
                    削除
                </a>

            </td>

        </tr>
        {% endfor %}

    </table>

    <br>

    <a href="/home" class="back">
        ← ホームへ戻る
    </a>

</div>

</body>
</html>
