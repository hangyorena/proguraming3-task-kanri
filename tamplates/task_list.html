<tbody>

{% for task in tasks %}

<tr>

    <td>{{ task.title }}</td>

    <td>{{ task.person }}</td>

    <td>{{ task.deadline }}</td>

    <td>{{ task.status }}</td>

    <td>

        <button class="delete-btn">削除</button>

       <a href="/delete/{{ task.id }}"
   class="delete-btn"
   onclick="return confirm('本当に削除しますか？')">
    削除
</a>
</a>

    </td>

</tr>

{% endfor %}

</tbody>
