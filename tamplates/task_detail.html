<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク詳細</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>タスク詳細</h1>

    <div class="detail-box">

        <table>

            <tr>
                <th>タスク名</th>
                <td>{{ task.title }}</td>
            </tr>

            <tr>
                <th>担当者</th>
                <td>{{ task.person }}</td>
            </tr>

            <tr>
                <th>期限</th>
                <td>{{ task.deadline }}</td>
            </tr>

            <tr>
                <th>進捗</th>
                <td>

                    {% if task.status == "未着手" %}
                        <span class="status notyet">
                            {{ task.status }}
                        </span>

                    {% elif task.status == "作業中" %}
                        <span class="status doing">
                            {{ task.status }}
                        </span>

                    {% else %}
                        <span class="status done">
                            {{ task.status }}
                        </span>
                    {% endif %}

                </td>
            </tr>

            <tr>
                <th>詳細</th>
                <td>{{ task.detail }}</td>
            </tr>

        </table>

    </div>

    <br>

    <a href="/calendar" class="back">
        ← カレンダーへ戻る
    </a>

</div>

</body>
</html>
