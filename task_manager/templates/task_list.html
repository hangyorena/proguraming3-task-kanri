<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>タスク一覧 | タスク管理ツール</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>タスク一覧</h1>

    <p>
        <a class="back"
           href="{{ url_for('task.task_add') }}">
            ＋ タスク追加
        </a>

        <a class="back"
           href="{{ url_for('auth.home') }}">
            ホームへ戻る
        </a>
    </p>

    <table class="calendar">

        <tr>
            <th>タイトル</th>
            <th>担当者</th>
            <th>締切</th>
            <th>進捗</th>
            <th>操作</th>
        </tr>

        {% for task in tasks %}

        <tr>

            <td>{{ task.title }}</td>

            <td>{{ task.person }}</td>

            <td>{{ task.deadline }}</td>

            <td>{{ task.status }}</td>

            <td>

                <a href="{{ url_for('calendar.task_detail', task_id=task.id) }}">
                    詳細
                </a>

                |

                <a href="{{ url_for('task.edit_task', id=task.id) }}">
                    編集
                </a>

                |

                {% if session["role"] == "admin" %}
                <a href="{{ url_for('task.delete_task', id=task.id) }}"
                onclick="return confirm('本当に削除しますか？')">
                    削除
                </a>
                {% endif %}

            </td>

        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
