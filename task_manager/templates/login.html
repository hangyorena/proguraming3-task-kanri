<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | タスク管理ツール</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style_login.css') }}">
</head>

<body>

<div class="login-container">

    <h1>🐟 タスク管理ツール 🐟</h1>
    <h2>ログイン</h2>

    <form action="{{ url_for('auth.login_check') }}" method="POST">

        <div class="input-group">
            <label>ユーザーID</label>
            <input
                type="text"
                name="username"
                placeholder="ユーザーIDを入力"
                required>
        </div>

        <div class="input-group">
            <label>パスワード</label>
            <input
                type="password"
                name="password"
                placeholder="パスワードを入力"
                required>
        </div>

        <button type="submit">
            ログイン
        </button>

    </form>

    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}

</div>

</body>
</html>
